name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: mvn clean verify

  connector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go test -v ./...
      - run: go build ./cmd/main.go

  migrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./migrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go build ./cmd/migrator

  integration-tests:
    runs-on: ubuntu-latest
    needs: [backend, connector, migrator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Start services
        run: docker compose up -d --build
      
      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Run tests
        working-directory: ./tests
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          API_HOST: localhost
          API_PORT: 8080
        run: go test -v ./...

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs backend
          docker compose logs postgres