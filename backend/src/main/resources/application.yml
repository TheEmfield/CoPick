spring:
  application:
    name: copick-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/testdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true #отладка

jwt:
  secret: ${JWT_SECRET}
  duration: ${JWT_DURATION}

server:
  port: 8080
