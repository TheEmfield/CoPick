spring:
  application:
    name: copick-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/testdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true #отладка
    
    recommendations:
      candidate-pool-size: 150

    algorithm:
      lambda: 0.5
      alpha: 0.6
      beta: 0.4
      rho: 0.15
      mu: 0.7
      kappa: 0.5
      M: 50
      K: 20

jwt:
  secret: ${JWT_SECRET}
  duration: ${JWT_DURATION}

server:
  port: 8080
